<div class="nav-items">
{%- for path in include.paths -%}
  {%- assign hyperpage = site.pages | where: "path", path | first -%}
  {%- if hyperpage.title -%}
    {%- if path == "hyperconnections/index.md" -%}
      <details class="nav-item nav-dropdown">
        <summary class="nav-dropdown-toggle">Games</summary>
        <div class="nav-dropdown-menu">
          <a class="nav-item nav-dropdown-link" href="{{ hyperpage.url | relative_url }}">Hyperconnections</a>
          <a class="nav-item nav-dropdown-link" href="{{ '/transversal/' | relative_url }}">Transversal</a>
        </div>
      </details>
    {%- else -%}
      <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ hyperpage.title | escape }}</a>
    {%- endif -%}
  {%- endif -%}
{%- endfor %}
</div>
