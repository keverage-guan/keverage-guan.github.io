# Site-wide settings
# ------------------

title: Kevin Guan

author:
  name: Kevin Guan            # display name, used to bold your name in author lists
  email: kevinguan@princeton.edu
  github: keverage-guan

description: >
  Kevin Guan — Papers, courses, CV, and contact information.

# Set this to your live URL. For a user site (keverage-guan.github.io) leave
# baseurl empty. For a project site, set baseurl: "/repo-name".
url: "https://keverage-guan.github.io"
baseurl: ""


# Build settings
# --------------

remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme   # needed for local builds; GitHub Pages supports it natively

# Files that should not be copied into the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor


# Minima-specific settings (Minima v3+)
# -------------------------------------

minima:
  # classic | dark | auto | solarized-light | solarized-dark | solarized
  skin: auto

  # Order of the links in the site navigation
  nav_pages:
    - papers.md
    - courses.md
    - cv.md
    - contact.md

  show_excerpts: false

  date_format: "%b %-d, %Y"

  # Icons come from Font Awesome Free. `icon` is the id without the `fa-` prefix.
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/keverage-guan"
    - title: Google Scholar
      icon: google-scholar
      url: "https://scholar.google.com/citations?hl=en&user=evwugkIAAAAJ#"
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/kevin-j-guan/"
    - title: ORCID
      icon: orcid
      url: "https://orcid.org/0009-0003-1602-7451"

  hide_site_feed_link: true